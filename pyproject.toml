[project]
name = "jobs-scrape"
version = "0.1.0"
description = "Collecte, enrichissement et exploration d'offres d'emploi suisses et francaises"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Xavier Beheydt", email = "xavier.beheydt@gmail.com" }]
keywords = ["scrapy", "jobs", "scraping", "suisse", "france", "emploi"]

dependencies = [
    "scrapy>=2.13",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
jobs-scrape = "jobs_scrape.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs_scrape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
