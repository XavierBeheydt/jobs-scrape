name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer les dependances
        run: uv sync --extra dev --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check src tests

      # Les tests tournent hors ligne, sur des reponses figees : aucune requete
      # n'est emise vers les sites collectes depuis la CI.
      - name: Tests
        run: uv run pytest -q
